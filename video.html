<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .hero-video-wrap{
        position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none;
        }
        .hero-video-iframe{
        position:absolute; top:50%; left:50%;
        width:100vw; height:56.25vw;      /* proporción 16:9 */
        min-height:100vh; min-width:177.78vh; /* asegura que cubra aunque la sección sea más alta que ancha */
        transform:translate(-50%,-50%);
        }
        @media (max-width: 767px){
        .hero-video-wrap{ display:none; } /* en celular queda solo la imagen de fondo, más liviano */
        }
    </style>
</head>
<body>
    
    <div class="hero-video-wrap">
        <iframe class="hero-video-iframe"
            src="https://www.youtube-nocookie.com/embed/4_ZQ10d_JNY?autoplay=1&mute=1&loop=1&playlist=4_ZQ10d_JNY&controls=0&showinfo=0&modestbranding=1&playsinline=1&rel=0"
            title="Invisa background video"
            frameborder="0"
            allow="autoplay; encrypted-media; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>


</body>
</html>
